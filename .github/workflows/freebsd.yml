name: freebsd

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  bsd-x86:
    if: "github.repository == 'OpenMathLib/OpenBLAS'"
    runs-on: ubuntu-latest
    steps:
     - name: checkout
       uses: actions/checkout@v6
     
     - name: build
       id: freebsd_x86_64
       uses: vmactions/freebsd-vm@v1
       with:
        usesh: true
        prepare: |

        run: |
          freebsd-version
          sysctl hw.ncpu
          pkg install -y gmake gcc15
          gmake CC=gcc15 FC=gfortran15
          
  bsd-32:
    if: "github.repository == 'OpenMathLib/OpenBLAS'"
    runs-on: ubuntu-latest
    steps:
     - name: checkout
       uses: actions/checkout@v6
     
     - name: build
       id: freebsd_x86
       uses: vmactions/freebsd-vm@v1
       with:
        release: "14.0"
        usesh: true
        run: |
          freebsd-version
          sysctl hw.ncpu
          pkg install -y gmake
          pkg -o ABI=FreeBSD:14:i386 install -y gcc15
          fetch https://download.freebsd.org/releases/amd64/15.1-RELEASE/lib32.txz
          tar Jxpf lib32.txz -C /
          ldconfig -32 -m /usr/lib32
          export LD_LIBRARY_PATH=/usr/lib32
          gmake CC=gcc15 FC=gfortran15 BINARY=32
          
